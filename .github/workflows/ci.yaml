name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  # Backend Build & Test
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build backend
        working-directory: ./backend
        run: mvn clean compile -DskipTests

      - name: Run backend tests
        working-directory: ./backend
        run: mvn test

      - name: Check code formatting (Spotless)
        working-directory: ./backend
        run: mvn spotless:check

      - name: Run Checkstyle
        working-directory: ./backend
        run: mvn checkstyle:check

      - name: Generate JaCoCo report
        working-directory: ./backend
        run: mvn jacoco:report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          retention-days: 7

  # Backend Package & Docker Build
  backend-package:
    name: Backend Package & Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Package backend (with tests)
        working-directory: ./backend
        run: mvn clean package -DskipTests=false

      - name: Build Docker image
        run: docker build -t evcharging-platform:${{ github.sha }} -f Dockerfile .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: evcharging-platform:${{ github.sha }}
          format: 'sarif'
          output: trivy-results.sarif
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Frontend Build & Test
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile=false

      - name: Run frontend linting
        working-directory: ./frontend
        run: pnpm lint

      - name: Check code formatting (Prettier)
        working-directory: ./frontend
        run: pnpm format:check

      - name: Run type checking
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm test:run

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-build, frontend-build]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: evcharging_test
          POSTGRES_USER: evcharging
          POSTGRES_PASSWORD: evcharging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evcharging -d evcharging_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run integration tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/evcharging_test
          SPRING_DATASOURCE_USERNAME: evcharging
          SPRING_DATASOURCE_PASSWORD: evcharging
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
        run: mvn verify -pl evcharging-app -am -DskipUnitTests=true

  # Docker Compose Integration Test
  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start docker-compose stack
        run: docker-compose up -d

      - name: Wait for services to be healthy
        run: |
          timeout=120
          interval=5
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if docker-compose ps --format json | jq -e 'all(.Health == "healthy" or .Health == "")' > /dev/null; then
              echo "All services healthy!"
              break
            fi
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout ]; then
            echo "Timeout waiting for services to become healthy"
            docker-compose ps
            docker-compose logs
            exit 1
          fi

      - name: Test health endpoint
        run: |
          sleep 10
          curl -f http://localhost:8080/actuator/health/liveness || exit 1

      - name: Test Swagger UI
        run: |
          curl -f http://localhost:8080/swagger-ui.html || exit 1

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'evcharging-platform'
          path: './backend'
          format: 'HTML,JSON,XML'
          out: 'dependency-check-report'
          args: '--failOnCVSS 7'

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          retention-days: 7

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          command: test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Notify on Failure
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [backend-build, backend-package, frontend-build, integration-tests, docker-compose-test, security-scan]
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Add Slack/Email notification here if configured

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true