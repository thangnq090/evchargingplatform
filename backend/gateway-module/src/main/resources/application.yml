# Gateway Module Configuration
# ==================================
server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-module

  # Cloud Gateway Configuration
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        # Routes are defined programmatically in GatewayConfig.java
        # This section can be used for additional static routes if needed

  # Security - OAuth2 Resource Server (JWT)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8080/api/v1/identity/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/evcharging}

  # WebFlux
  webflux:
    base-path: /

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,gateways
  endpoint:
    health:
      show-details: always
  health:
    gateway:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    com.evcharging.gateway: DEBUG
    reactor.netty: INFO

# Gateway-specific properties
gateway:
  # Rate limiting (future implementation)
  rate-limit:
    enabled: false
    default-requests-per-second: 100
    default-burst-capacity: 200

  # Correlation ID header
  correlation-header: X-Correlation-ID

# OpenAPI/Swagger (delegated to evcharging-app)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false